{% extends "base.html" %} {% block title %}Add Scholarship{% endblock %} {%
block content %}

<div class="container py-5">
  <h1 class="mb-4">Add Scholarship</h1>

  <div class="card shadow-sm">
    <div class="card-body p-4">
      <form method="POST" enctype="multipart/form-data">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Scholarship Title</label>
            <input type="text" name="title" class="form-control" required />
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Country</label>
            <input
              type="text"
              name="country"
              class="form-control"
              list="country-list"
              placeholder="Search or select country"
              required
            />

            <datalist id="country-list">
              <option value="Afghanistan"></option>
              <option value="Albania"></option>
              <option value="Algeria"></option>
              <option value="Argentina"></option>
              <option value="Australia"></option>
              <option value="Austria"></option>
              <option value="Azerbaijan"></option>
              <option value="Bahrain"></option>
              <option value="Bangladesh"></option>
              <option value="Belgium"></option>
              <option value="Brazil"></option>
              <option value="Brunei"></option>
              <option value="Bulgaria"></option>
              <option value="Canada"></option>
              <option value="China"></option>
              <option value="Colombia"></option>
              <option value="Croatia"></option>
              <option value="Cyprus"></option>
              <option value="Czech Republic"></option>
              <option value="Denmark"></option>
              <option value="Egypt"></option>
              <option value="Estonia"></option>
              <option value="Finland"></option>
              <option value="France"></option>
              <option value="Georgia"></option>
              <option value="Germany"></option>
              <option value="Greece"></option>
              <option value="Hungary"></option>
              <option value="Iceland"></option>
              <option value="India"></option>
              <option value="Indonesia"></option>
              <option value="Iran"></option>
              <option value="Iraq"></option>
              <option value="Ireland"></option>
              <option value="Israel"></option>
              <option value="Italy"></option>
              <option value="Japan"></option>
              <option value="Jordan"></option>
              <option value="Kazakhstan"></option>
              <option value="Kenya"></option>
              <option value="Kuwait"></option>
              <option value="Latvia"></option>
              <option value="Lebanon"></option>
              <option value="Lithuania"></option>
              <option value="Luxembourg"></option>
              <option value="Malaysia"></option>
              <option value="Maldives"></option>
              <option value="Malta"></option>
              <option value="Mexico"></option>
              <option value="Monaco"></option>
              <option value="Morocco"></option>
              <option value="Nepal"></option>
              <option value="Netherlands"></option>
              <option value="New Zealand"></option>
              <option value="Nigeria"></option>
              <option value="Norway"></option>
              <option value="Oman"></option>
              <option value="Pakistan"></option>
              <option value="Philippines"></option>
              <option value="Poland"></option>
              <option value="Portugal"></option>
              <option value="Qatar"></option>
              <option value="Romania"></option>
              <option value="Russia"></option>
              <option value="Saudi Arabia"></option>
              <option value="Serbia"></option>
              <option value="Singapore"></option>
              <option value="Slovakia"></option>
              <option value="Slovenia"></option>
              <option value="South Africa"></option>
              <option value="South Korea"></option>
              <option value="Spain"></option>
              <option value="Sri Lanka"></option>
              <option value="Sweden"></option>
              <option value="Switzerland"></option>
              <option value="Thailand"></option>
              <option value="Tunisia"></option>
              <option value="Türkiye"></option>
              <option value="Ukraine"></option>
              <option value="United Arab Emirates"></option>
              <option value="United Kingdom"></option>
              <option value="United States"></option>
              <option value="Uzbekistan"></option>
              <option value="Vietnam"></option>
            </datalist>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">University</label>
            <input type="text" name="university" class="form-control" />
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Degree</label>
            <input type="text" name="degree" class="form-control" />
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Deadline</label>
            <input type="date" name="deadline" class="form-control" />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Opportunity Type</label>

            <div class="border rounded p-3">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="opportunity_type"
                  value="Undergraduate"
                  id="undergraduate"
                />
                <label class="form-check-label" for="undergraduate">
                  Undergraduate
                </label>
              </div>

              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="opportunity_type"
                  value="Master's"
                  id="masters"
                />
                <label class="form-check-label" for="masters"> Master's </label>
              </div>

              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="opportunity_type"
                  value="PhD"
                  id="phd"
                />
                <label class="form-check-label" for="phd"> PhD </label>
              </div>

              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="opportunity_type"
                  value="Postdoctoral"
                  id="postdoctoral"
                />
                <label class="form-check-label" for="postdoctoral">
                  Postdoctoral
                </label>
              </div>

              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="opportunity_type"
                  value="Diploma / Certificate"
                  id="diploma"
                />
                <label class="form-check-label" for="diploma">
                  Diploma / Certificate
                </label>
              </div>

              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="opportunity_type"
                  value="Internship"
                  id="internship"
                />
                <label class="form-check-label" for="internship">
                  Internship
                </label>
              </div>

              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="opportunity_type"
                  value="Fellowship"
                  id="fellowship"
                />
                <label class="form-check-label" for="fellowship">
                  Fellowship
                </label>
              </div>

              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="opportunity_type"
                  value="Exchange Program"
                  id="exchange"
                />
                <label class="form-check-label" for="exchange">
                  Exchange Program
                </label>
              </div>
            </div>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Language Requirement</label>

            <select name="language_requirement" class="form-select">
              <option value="">Select Language Requirement</option>
              <option value="IELTS">IELTS</option>
              <option value="No IELTS">No IELTS</option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Official Link</label>
            <input
              type="url"
              name="apply_link"
              class="form-control"
              placeholder="https://example.com"
            />
          </div>

          <div class="col-12 mb-3">
            <label class="form-label">Scholarship Image</label>
            <input
              type="file"
              name="image"
              class="form-control"
              accept="image/*"
            />
          </div>

          <div class="col-12 mb-3">
            <label class="form-label">Description</label>
            <textarea
              name="description"
              class="form-control"
              rows="4"
            ></textarea>
          </div>

          <div class="col-12 mb-3">
            <label class="form-label"> Benefits </label>
            <textarea
              name="benefits"
              class="form-control"
              rows="4"
              placeholder="Tuition Fee, Monthly Stipend, Airfare"
            ></textarea>

            <small class="text-muted">
              Separate multiple benefits with commas.
            </small>
          </div>

          <div class="col-12 mb-3">
            <label class="form-label"> Eligibility </label>
            <textarea
              name="eligibility"
              class="form-control"
              rows="4"
              placeholder="International students, Good academic record, Bachelor's degree"
            ></textarea>

            <small class="text-muted">
              Separate multiple requirements with commas.
            </small>
          </div>

          <div class="col-12 mb-3">
            <label class="form-label"> Required Documents </label>
            <textarea
              name="documents"
              class="form-control"
              rows="4"
              placeholder="CV, Academic Transcripts, Passport, Recommendation Letter"
            ></textarea>

            <small class="text-muted">
              Separate multiple documents with commas.
            </small>
          </div>
          <div class="col-12 mb-3">
            <label class="form-label">How to Apply</label>
            <textarea
              name="how_to_apply"
              class="form-control"
              rows="5"
              placeholder="Step 1: Visit the official website, Step 2: Complete the application form, Step 3: Upload required documents, Step 4: Submit your application"
            ></textarea>

            <small class="text-muted">
              Separate application steps with commas.
            </small>
          </div>
        </div>

        <div class="d-flex gap-2 mt-3">
          <button type="submit" class="btn btn-primary">
            Save Scholarship
          </button>

          <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">
            Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
