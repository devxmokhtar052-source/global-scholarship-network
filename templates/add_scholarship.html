{% extends "base.html" %} {% block title %}Add Scholarship{% endblock %} {%
block content %}

<div class="container py-5">
  <h1 class="mb-4">Add Scholarship</h1>

  <div class="card shadow-sm">
    <div class="card-body p-4">
      <form method="POST" enctype="multipart/form-data">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Scholarship Title</label>
            <input type="text" name="title" class="form-control" required />
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Country</label>
            <input type="text" name="country" class="form-control" required />
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">University</label>
            <input type="text" name="university" class="form-control" />
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Degree</label>
            <input type="text" name="degree" class="form-control" />
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Deadline</label>
            <input
              type="date"
              name="deadline"
              class="form-control"
            />
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Official Link</label>
            <input
              type="url"
              name="apply_link"
              class="form-control"
              placeholder="https://example.com"
            />
          </div>

          <div class="col-12 mb-3">
            <label class="form-label">Scholarship Image</label>
            <input
              type="file"
              name="image"
              class="form-control"
              accept="image/*"
            />
          </div>

          <div class="col-12 mb-3">
            <label class="form-label">Description</label>
            <textarea
              name="description"
              class="form-control"
              rows="4"
            ></textarea>
          </div>

          <div class="col-12 mb-3">
            <label class="form-label"> Benefits </label>
            <textarea
              name="benefits"
              class="form-control"
              rows="4"
              placeholder="Tuition Fee, Monthly Stipend, Airfare"
            ></textarea>

            <small class="text-muted">
              Separate multiple benefits with commas.
            </small>
          </div>

          <div class="col-12 mb-3">
            <label class="form-label"> Eligibility </label>
            <textarea
              name="eligibility"
              class="form-control"
              rows="4"
              placeholder="International students, Good academic record, Bachelor's degree"
            ></textarea>

            <small class="text-muted">
              Separate multiple requirements with commas.
            </small>
          </div>

          <div class="col-12 mb-3">
            <label class="form-label"> Required Documents </label>
            <textarea
              name="documents"
              class="form-control"
              rows="4"
              placeholder="CV, Academic Transcripts, Passport, Recommendation Letter"
            ></textarea>

            <small class="text-muted">
              Separate multiple documents with commas.
            </small>
          </div>
        </div>

        <div class="d-flex gap-2 mt-3">
          <button type="submit" class="btn btn-primary">
            Save Scholarship
          </button>

          <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">
            Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
